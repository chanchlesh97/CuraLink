server:
  port: 4004
#auth:
#  service:
#    url: http://host.docker.internal:4005

spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: http://auth-service.cura-link.local:4005
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: patient-service-routes
              uri: http://patient-service.cura-link.local:4000
              predicates:
                - Path=/api/v1/patients/**
              filters:
                #                - StripPrefix=1
                - JwtValidation

            - id: api-docs-patient-route
              uri: http://patient-service.cura-link.local:4000
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs

            - id: api-docs-auth-route
              uri: http://auth-service.cura-link.local:4005
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth,/v3/api-docs