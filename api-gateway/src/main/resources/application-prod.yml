server:
  port: 4004
#auth:
#  service:
#    url: http://host.docker.internal:4005

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: http://localhost:4005s
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: patient-service-routes
              uri: http://host.docker.internal:4000
              predicates:
                - Path=/api/v1/patients/**
              filters:
                #                - StripPrefix=1
                - JwtValidation

            - id: api-docs-patient-route
              uri: http://host.docker.internal:4000
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs